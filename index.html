<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Oglebay Cup</title>
<style>
:root{
  --brand:#0d5132;
  --brand-dark:#083823;
  --brand-light:#177049;
  --green:#1e7d33;
  --green-bg:#e6f4e9;
  --over:#c41e3a;
  --over-bg:#fdeaee;
  --gold:#f5b80c;
  --gold-bg:#fff6dd;
  --cream:#f7f1e1;
  --bg:#eef1f0;
  --card:#ffffff;
  --border:#d7ded9;
  --text:#1c2733;
  --muted:#5d6b7c;
  --faint:#94a1b2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}

/* ===== Header ===== */
.hdr{background:var(--brand);color:#fff}
.hdr-top{padding:14px 16px 6px;text-align:center}
.hdr-logo{width:84px;display:block;margin:0 auto 12px;background:#fff;border-radius:8px;padding:6px}
.hdr-title{font-size:24px;font-weight:700;letter-spacing:.3px}
.hdr-sub{font-size:10.5px;color:#a8c9b8;letter-spacing:.6px;text-transform:uppercase;margin-top:4px}
.hdr-lead{padding:10px 16px 14px;text-align:center}
.hl-cap{font-size:10px;color:#8fb3a0;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.hl-team{font-size:16px;font-weight:700;color:#fff}
.hl-score{font-size:28px;font-weight:700;line-height:1.15;margin-top:2px}
.hl-score.under{color:#8fe0a5}
.hl-score.over{color:#ff9fae}
.hl-score.even{color:#fff}
.hl-thru{font-size:11px;color:#a8c9b8;margin-top:2px}
.tabs{display:flex;background:var(--brand-dark)}
.tab{flex:1;padding:11px 2px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.2px;text-transform:uppercase;color:#8fb3a0;border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--gold)}
@media(max-width:400px){.tab{font-size:10px;letter-spacing:0}}

/* ===== Layout ===== */
.wrap{max-width:800px;margin:0 auto;padding:12px 12px 48px}
.banner{background:#fff8e1;border:1px solid #f0d68a;color:#7a5d00;font-size:12px;padding:10px 12px;border-radius:6px;margin-bottom:12px;line-height:1.5}
.banner b{font-weight:700}
.banner.warn{background:var(--over-bg);border-color:#e6b3bd;color:#8d1327}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.card-hd{background:#f3f6f4;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.card-hd .t{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.card-hd .r{font-size:11px;color:var(--faint)}
.sess-meta{font-size:12px;color:var(--muted);margin:6px 2px 10px;line-height:1.5}

/* ===== Team list ===== */
.team-row{display:flex;align-items:stretch;border-bottom:1px solid #edf0f4;cursor:pointer;background:var(--card)}
.team-row:last-child{border-bottom:none}
.team-row:active{background:#f3f6f4}
.tr-num{width:34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--faint);background:#f7faf8;border-right:1px solid #edf0f4}
.tr-body{flex:1;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tr-name{font-size:13.5px;font-weight:700;color:var(--brand)}
.tr-players{font-size:11px;color:var(--faint);margin-top:2px}
.tr-status{text-align:right;min-width:74px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:11px;letter-spacing:.3px;white-space:nowrap}
.pill.under{background:var(--green-bg);color:var(--green)}
.pill.over{background:var(--over-bg);color:var(--over)}
.pill.even{background:#eceff3;color:var(--muted)}
.pill.pend{background:transparent;color:var(--faint);border:1px dashed var(--border);font-weight:600}
.pill.live{background:var(--gold-bg);color:#8a6400}
.tr-thru{font-size:10px;color:var(--faint);margin-top:2px}

/* ===== Scorecard ===== */
.sc-top{padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
.back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--brand);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:8px}
.sc-fmt{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.sc-team{font-size:17px;font-weight:700;color:var(--brand);margin-top:6px}
.sc-status{display:flex;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;border-radius:6px;padding:9px 12px;margin-top:10px}
.sc-status .lbl{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#a8c9b8}
.sc-status .val{font-size:15px;font-weight:700}
.fmt-note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55}

/* ===== Segment ===== */
.seg{margin-bottom:16px}
.seg-hd{background:var(--brand-dark);color:#fff;border-radius:8px 8px 0 0;padding:9px 12px;display:flex;align-items:center;justify-content:space-between}
.seg-hd .st{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.seg-hd .ss{font-size:12px;font-weight:700;color:var(--gold)}
.seg-pick{background:var(--cream);border:1px solid var(--border);border-top:none;padding:10px 12px}
.seg-pick label{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#7a6a45;margin-bottom:5px}
.seg-pick select{width:100%;padding:10px;border:1px solid #cfc4a6;border-radius:6px;font-size:15px;font-weight:600;background:#fff;color:var(--text);-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%235d6b7c' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.seg-bb{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.seg-bb b{color:var(--brand);font-weight:700}
.seg-holes{border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;overflow:hidden}

/* ===== Hole card ===== */
.hcard{background:var(--card);border-top:1px solid #edf0f4;padding:9px 10px}
.hcard:first-child{border-top:none}
.hcard.locked{opacity:.45;pointer-events:none}
.hc-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.hc-num{font-size:13px;font-weight:700;color:var(--brand)}
.hc-name{font-size:11px;font-weight:600;color:var(--faint);margin-left:5px}
.hc-par{font-size:10.5px;color:var(--faint);flex:1;text-align:center}
.hc-tot{font-size:14px;font-weight:700;min-width:64px;text-align:right}
.hc-tot .rel{font-size:11px;font-weight:700;margin-left:5px}
.hc-tot .rel.under{color:var(--green)}
.hc-tot .rel.over{color:var(--over)}
.hc-tot .rel.even{color:var(--faint)}
.hc-tot .rel.eagle{color:#8a6400}
.hc-tot.blank{color:var(--faint);font-weight:600;font-size:11px}
.hc-players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcell{border:1px solid var(--border);border-radius:6px;padding:5px;text-align:center;background:#fafbfa}
.pcell.single{border-color:var(--brand);background:#f0f6f2}
.pcell.scr{border-color:var(--gold);background:var(--gold-bg)}
.pl{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;height:13px}
.pcell.single .pl{color:var(--brand)}
.pcell.scr .pl{color:#8a6400}
.tagS{display:inline-block;background:var(--brand);color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;letter-spacing:.4px;vertical-align:1px}
.tagC{display:inline-block;background:#8a6400;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;letter-spacing:.4px;vertical-align:1px}
.hinp{height:40px;font-size:18px;font-weight:600;text-align:center;border:1px solid var(--border);border-radius:5px;background:#fff;color:var(--text);width:100%}
.hinp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(13,81,50,.15)}
.seg-sub{display:flex;justify-content:space-between;align-items:center;background:#f3f6f4;padding:8px 12px;font-size:11.5px;font-weight:600;color:var(--muted);border-top:1px solid var(--border)}
.seg-sub b{color:var(--brand);font-size:13px}

/* ===== Player totals ===== */
.ptot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.ptot .pc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px;text-align:center}
.ptot .pc .n{font-size:11px;font-weight:700;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptot .pc .v{font-size:19px;font-weight:700;margin-top:3px}
.ptot .pc .s{font-size:10px;color:var(--faint);margin-top:1px}

/* ===== Leaderboard ===== */
.total-card{background:var(--brand);border-radius:8px;color:#fff;padding:16px;margin-bottom:14px;text-align:center}
.tc-cap{font-size:10px;color:#8fb3a0;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.tc-name{font-size:17px;font-weight:700}
.tc-pts{font-size:34px;font-weight:700;line-height:1.15;margin-top:2px}
.tc-gap{font-size:12px;color:#a8c9b8;margin-top:6px}
.lb-tbl{width:100%;border-collapse:collapse;font-size:13px}
.lb-tbl td{padding:9px 10px;border-bottom:1px solid #edf0f4;vertical-align:middle}
.lb-tbl tr:last-child td{border-bottom:none}
.lb-rank{width:26px;font-weight:700;color:var(--faint);font-size:12px}
.lb-team{font-weight:700;font-size:13px;color:var(--brand)}
.lb-sub{font-size:10.5px;color:var(--faint);margin-top:2px}
.lb-thru{text-align:center;width:18%;font-size:11.5px;color:var(--muted)}
.lb-score{text-align:right;width:22%}

/* ===== Skins ===== */
.sk-tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.sk-tally .c{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.sk-tally .c .n{font-size:11.5px;font-weight:700;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-tally .c .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:2px}
.sk-tally .c .s{font-size:10px;color:var(--faint)}
.sk-tbl{width:100%;border-collapse:collapse;font-size:13px}
.sk-tbl th{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);background:#f3f6f4;padding:7px 8px;border-bottom:1px solid var(--border);text-align:left}
.sk-tbl td{padding:8px;border-bottom:1px solid #edf0f4;vertical-align:middle}
.sk-tbl tr:last-child td{border-bottom:none}
.sk-tbl tr.won{background:#f4faf6}
.sk-h{width:52px;font-weight:700;color:var(--brand);font-size:14px}
.sk-h .p{display:block;font-size:9.5px;font-weight:600;color:var(--faint);letter-spacing:0}
.sk-low{width:56px;text-align:center;font-weight:700;font-size:16px}
.sk-low .r{display:block;font-size:9.5px;font-weight:700;color:var(--faint)}
.sk-low.none{color:var(--faint);font-size:13px;font-weight:600}
.sk-team{font-size:12px;font-weight:600;color:var(--text);line-height:1.35}
.sk-team.none{color:var(--faint);font-weight:500}
.sk-skin{width:56px;text-align:center}
.sk-yes{color:var(--green);font-size:18px;font-weight:700}
.sk-tie{color:var(--faint);font-size:9.5px;font-weight:700;letter-spacing:.4px}

/* ===== Admin ===== */
.alogin{max-width:300px;margin:36px auto;text-align:center}
.alogin input{width:100%;padding:11px;border:1px solid var(--border);border-radius:6px;font-size:15px;margin:10px 0;text-align:center}
.btn{display:inline-block;padding:10px 18px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.3px}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:transparent;border-color:#d8a0a9;color:var(--over)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:active{transform:scale(.98)}
.atabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.atab{padding:7px 13px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.atab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.team-card .tc-hd{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.team-card input{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:#fafbfa;margin-bottom:6px}
.team-card input:last-child{margin-bottom:0}
.team-card input:focus{outline:none;border-color:var(--brand);background:#fff}
.team-card .tc-derived{font-size:13.5px;font-weight:700;color:var(--brand);margin-bottom:7px}
.team-card .tc-derived.empty{color:var(--faint);font-weight:600}
.par-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.par-grid{grid-template-columns:repeat(6,1fr)}}
.par-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px;text-align:center}
.par-cell .l{font-size:9px;color:var(--faint);text-transform:uppercase;font-weight:700;margin-bottom:4px}
.par-cell input{width:100%;padding:6px;border:1px solid var(--border);border-radius:5px;font-size:14px;text-align:center;background:#fafbfa}
.par-totals{font-size:12px;color:var(--muted);margin:10px 2px}
.nine-hd{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.reset-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;font-weight:600}
.bulk{width:100%;min-height:110px;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6;background:#fafbfa}
.conn{position:fixed;bottom:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.4px;padding:4px 10px;border-radius:12px;z-index:50}
.conn.on{background:var(--green-bg);color:var(--green)}
.conn.off{background:var(--over-bg);color:var(--over)}
.empty{padding:28px;text-align:center;color:var(--faint);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="conn" class="conn off">CONNECTING&hellip;</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   FIREBASE CONFIG
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyA0•••••••••••••••••••••••••••••••",
  authDomain: "jay-oglebay-scramblebetterball.firebaseapp.com",
  databaseURL: "https://jay-oglebay-scramblebetterball-default-rtdb.firebaseio.com",
  projectId: "jay-oglebay-scramblebetterball",
  storageBucket: "jay-oglebay-scramblebetterball.firebasestorage.app",
  messagingSenderId: "501915665674",
  appId: "1:501915665674:web:85bde07e4c2742b86726f3"
};
const DB_PATH = 'crispin';            // must match the key in your database rules
const ADMIN_PASSWORD = "captain";     // change this before you share the link
/* ============================================================ */

const NUM_TEAMS   = 2;
const TEAM_SIZE   = 3;
const NUM_HOLES   = 18;
const SEG_LEN     = 6;                // single changes every 6 holes
const NUM_SEGS    = NUM_HOLES / SEG_LEN;
const COURSE_NAME = "Crispin Golf Course";
const EVENT_DEFAULT = "Oglebay Cup";

/* Crispin Golf Course, Oglebay — Wheeling, WV. Out 36 / In 35 / Par 71 */
const PAR_DEFAULT  = [4,3,4,5,3,4,3,5,5, 3,4,5,3,4,4,4,4,4];
const HOLE_NAMES   = ["Front Yard","88 South","Big Bend","Lodge View","Short Gap","Up Hill","Down Hill","Long Stretch","Short Stretch",
                      "Back Yard","88 North","The View","The Slide","Road Side","Caddy Camp","Turn-Around","Tree Line","Home Stretch"];
const HOLE_HCP     = [15,9,11,5,17,7,13,1,3, 16,2,8,12,6,4,18,14,10];

const PKEYS = ['p1','p2','p3'];

function defaultState(){
  return {
    eventName: EVENT_DEFAULT,
    teams: Array.from({length:NUM_TEAMS},()=>({
      name: '', p1:'', p2:'', p3:'',
      singles: {},   // s0 / s1 / s2  ->  0 | 1 | 2
      scores: {}     // "h0p1" -> single's gross ; "h0sc" -> pair's scramble score
    })),
    par: PAR_DEFAULT.slice()
  };
}

/* ---------- Firebase / local fallback ---------- */
let state = defaultState();
let db = null, ref = null, online = false;
const localMode = firebaseConfig.apiKey.indexOf("PASTE") === 0;

function setConn(on, txt){
  const el = document.getElementById('conn');
  el.className = 'conn ' + (on ? 'on' : 'off');
  el.textContent = txt;
}

if (!localMode){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    ref = db.ref(DB_PATH);
    ref.on('value', snap=>{
      const v = snap.val();
      if (v === null){ ref.set(state); return; }
      const incoming = normalize(v);
      if (JSON.stringify(incoming) === JSON.stringify(state)) return;
      state = incoming;
      renderPreservingFocus();
    });
    db.ref('.info/connected').on('value', s=>{
      online = !!s.val();
      setConn(online, online ? 'LIVE SYNC' : 'OFFLINE — RETRYING');
    });
  }catch(e){
    setConn(false,'SYNC ERROR');
  }
} else {
  try{ const s = localStorage.getItem(DB_PATH); if (s) state = normalize(JSON.parse(s)); }catch(e){}
  setConn(false,'LOCAL ONLY — NO SYNC');
}

/* Firebase drops empty objects and turns sparse arrays into maps — rebuild the shape */
function toArr(v){
  if (!v) return [];
  if (Array.isArray(v)) return v;
  return Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]);
}
function normalize(v){
  const st = v || {};
  const out = { eventName: st.eventName || EVENT_DEFAULT };
  const teams = toArr(st.teams);
  out.teams = Array.from({length:NUM_TEAMS},(_,i)=>{
    const t = teams[i] || {};
    const singles = {};
    for (let s=0;s<NUM_SEGS;s++){
      const raw = (t.singles||{})['s'+s];
      singles['s'+s] = (raw===0||raw===1||raw===2) ? raw : null;
    }
    return {
      name: t.name || '',
      p1: t.p1 || '', p2: t.p2 || '', p3: t.p3 || '',
      singles: singles,
      scores: t.scores || {}
    };
  });
  const par = toArr(st.par);
  out.par = Array.from({length:NUM_HOLES},(_,i)=>{
    const p = parseInt(par[i]);
    return (p>=3 && p<=6) ? p : PAR_DEFAULT[i];
  });
  return out;
}

function persist(path, value){
  if (!localMode && ref){
    db.ref(DB_PATH + '/' + path).set(value);
  } else {
    try{ localStorage.setItem(DB_PATH, JSON.stringify(state)); }catch(e){}
  }
}

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtRel(n){ return n===0 ? 'E' : (n>0 ? '+'+n : String(n)); }
function relClass(n){ return n===0 ? 'even' : (n>0 ? 'over' : 'under'); }
function lastName(s){
  const parts = String(s||'').trim().split(/\s+/).filter(Boolean);
  return parts.length ? parts[parts.length-1] : '';
}
function playerName(t, pi){
  const v = String(t[PKEYS[pi]]||'').trim();
  return v || ('Player ' + (pi+1));
}
function shortName(t, pi){
  const v = String(t[PKEYS[pi]]||'').trim();
  if (!v) return 'P' + (pi+1);
  const ln = lastName(v);
  return ln || v;
}
function teamName(t, i){
  if (String(t.name||'').trim()) return t.name.trim();
  const lns = PKEYS.map(k=>lastName(t[k])).filter(Boolean);
  return lns.length ? lns.join(' / ') : ('Team ' + (i+1));
}
function rosterLine(t){
  const ns = PKEYS.map(k=>String(t[k]||'').trim()).filter(Boolean);
  return ns.join(' · ');
}
function segOf(h){ return Math.floor(h / SEG_LEN); }
function segHoles(s){ const a=[]; for(let h=s*SEG_LEN; h<(s+1)*SEG_LEN; h++) a.push(h); return a; }
function teamPar(h){ return state.par[h] * 2; }
function totalTeamPar(){ return state.par.reduce((a,b)=>a+b,0) * 2; }

/* ---------- Scoring engine ----------
   Each hole a team posts TWO scores:
     1. the designated single's own gross score
     2. the scramble score of the other two players
   Team hole score = single + scramble, played against double par. */
function scoreOf(t, h, pi){
  const v = parseInt(t.scores['h'+h+'p'+pi]);
  return (v>0) ? v : null;
}
function scrambleOf(t, h){
  const v = parseInt(t.scores['h'+h+'sc']);
  return (v>0) ? v : null;
}
function holeResult(t, h){
  const sIdx = t.singles['s'+segOf(h)];
  const res = { sIdx, single:null, scr:null, total:null, par:teamPar(h), rel:0, complete:false, any:false };
  res.scr = scrambleOf(t, h);
  if (sIdx===null || sIdx===undefined) {
    res.any = res.scr!==null || PKEYS.some((_,pi)=>scoreOf(t,h,pi)!==null);
    return res;
  }
  res.single = scoreOf(t, h, sIdx);
  res.any = res.single!==null || res.scr!==null;
  if (res.single!==null && res.scr!==null){
    res.total = res.single + res.scr;
    res.rel = res.total - res.par;
    res.complete = true;
  }
  return res;
}
function teamResult(t){
  let strokes=0, parSum=0, thru=0, partial=false;
  for (let h=0; h<NUM_HOLES; h++){
    const r = holeResult(t, h);
    if (r.complete){ strokes+=r.total; parSum+=r.par; thru++; }
    else if (r.any) partial = true;
  }
  return { strokes, parSum, thru, partial,
           toPar: thru ? strokes-parSum : 0,
           started: thru>0 || partial,
           done: thru===NUM_HOLES };
}
function segResult(t, s){
  let strokes=0, parSum=0, n=0;
  segHoles(s).forEach(h=>{
    const r = holeResult(t,h);
    if (r.complete){ strokes+=r.total; parSum+=r.par; n++; }
  });
  return { strokes, parSum, n, toPar: n ? strokes-parSum : 0 };
}
/* A player's gross over the six holes they played as the single */
function playerTotal(t, pi){
  let strokes=0, n=0;
  for (let h=0;h<NUM_HOLES;h++){
    if (t.singles['s'+segOf(h)] !== pi) continue;
    const v = scoreOf(t,h,pi);
    if (v!==null){ strokes+=v; n++; }
  }
  return { strokes, n };
}
function scrambleTotal(t){
  let strokes=0, parSum=0, n=0;
  for (let h=0;h<NUM_HOLES;h++){
    const v = scrambleOf(t,h);
    if (v!==null){ strokes+=v; parSum+=state.par[h]; n++; }
  }
  return { strokes, parSum, n, toPar: n ? strokes-parSum : 0 };
}
function duplicateSingles(t){
  const used = [];
  for (let s=0;s<NUM_SEGS;s++){
    const v = t.singles['s'+s];
    if (v===null || v===undefined) continue;
    if (used.indexOf(v)>=0) return true;
    used.push(v);
  }
  return false;
}
function ranked(){
  return state.teams.map((t,i)=>({team:t, idx:i, r:teamResult(t)}))
    .sort((a,b)=>{
      if (a.r.thru>0 !== b.r.thru>0) return a.r.thru>0 ? -1 : 1;
      if (a.r.toPar !== b.r.toPar) return a.r.toPar - b.r.toPar;
      if (a.r.thru !== b.r.thru) return b.r.thru - a.r.thru;
      return a.idx - b.idx;
    });
}

/* ---------- Skins ----------
   Low team score on a hole wins the skin. A tie means nobody wins it. */
function skinsRows(){
  const rows = [];
  for (let h=0; h<NUM_HOLES; h++){
    let best = null, winners = [];
    state.teams.forEach((t,i)=>{
      const r = holeResult(t, h);
      if (!r.complete) return;
      if (best===null || r.total < best){ best = r.total; winners = [i]; }
      else if (r.total === best) winners.push(i);
    });
    rows.push({ h, best, winners, skin: best!==null && winners.length===1 });
  }
  return rows;
}
function skinsWonBy(rows, idx){
  return rows.filter(r=>r.skin && r.winners[0]===idx).length;
}

/* ---------- View state ---------- */
let view = 'teams';           // teams | leaderboard | skins | admin
let scoringIdx = null;
let adminOk = false;
let adminTab = 'teams';
let bulkMsg = '';

/* ---------- Renderers ---------- */
function render(){
  const rk = ranked();
  const leader = rk[0];
  let html = `
  <div class="hdr">
    <div class="hdr-top">
      <img class="hdr-logo" src="./image.png" alt="" onerror="this.style.display='none'">
      <div class="hdr-title">${esc(state.eventName)}</div>
      <div class="hdr-sub">${esc(COURSE_NAME)} · ${NUM_TEAMS} Teams · ${NUM_TEAMS*TEAM_SIZE} Players · Single + Scramble</div>
    </div>
    <div class="hdr-lead">`;
  if (leader && leader.r.thru>0){
    html += `
      <div class="hl-cap">Leader</div>
      <div class="hl-team">${esc(teamName(leader.team, leader.idx))}</div>
      <div class="hl-score ${relClass(leader.r.toPar)}">${fmtRel(leader.r.toPar)}</div>
      <div class="hl-thru">thru ${leader.r.thru}</div>`;
  } else {
    html += `<div class="hl-cap">No scores yet</div><div class="hl-thru">Tap a team below to start scoring</div>`;
  }
  html += `
    </div>
    <div class="tabs">
      <button class="tab ${view==='teams'?'on':''}" onclick="go('teams')">Teams</button>
      <button class="tab ${view==='leaderboard'?'on':''}" onclick="go('leaderboard')">Leaderboard</button>
      <button class="tab ${view==='skins'?'on':''}" onclick="go('skins')">Skins</button>
      <button class="tab ${view==='admin'?'on':''}" onclick="go('admin')">Admin</button>
    </div>
  </div>
  <div class="wrap">`;

  if (localMode) html += `<div class="banner"><b>Local mode:</b> Firebase config not set — scores save on this device only. Paste your Firebase config in index.html to enable live sync.</div>`;

  if (scoringIdx !== null) html += renderScorecard();
  else if (view === 'teams') html += renderTeams();
  else if (view === 'leaderboard') html += renderBoard();
  else if (view === 'skins') html += renderSkins();
  else html += renderAdmin();

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function renderTeams(){
  let html = `<div class="banner"><b>Format:</b> each threesome posts two scores per hole — one designated <b>single</b> playing his own ball, plus a <b>scramble</b> between the other two. The single changes every 6 holes (holes 1, 7 and 13). Par is doubled: <b>${totalTeamPar()}</b> for the round.</div>`;
  html += `<div class="sess-meta">Tap your team to pick your single and enter scores.</div>`;
  html += `<div class="card">`;
  state.teams.forEach((t,i)=>{
    const r = teamResult(t);
    let pill;
    if (r.done) pill = `<span class="pill ${relClass(r.toPar)}">${fmtRel(r.toPar)}</span><div class="tr-thru">final</div>`;
    else if (r.thru>0) pill = `<span class="pill live">${fmtRel(r.toPar)}</span><div class="tr-thru">thru ${r.thru}</div>`;
    else pill = `<span class="pill pend">TAP TO SCORE</span>`;
    const roster = rosterLine(t);
    html += `
    <div class="team-row" onclick="openScore(${i})">
      <div class="tr-num">${i+1}</div>
      <div class="tr-body">
        <div>
          <div class="tr-name">${esc(teamName(t,i))}</div>
          ${roster ? `<div class="tr-players">${esc(roster)}</div>` : `<div class="tr-players">Add players in Admin</div>`}
        </div>
        <div class="tr-status">${pill}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderScorecard(){
  const i = scoringIdx;
  const t = state.teams[i];
  const r = teamResult(t);
  let html = `
  <div class="sc-top">
    <button class="back" onclick="closeScore()">&#8592; All teams</button>
    <div class="sc-fmt">Team ${i+1} of ${NUM_TEAMS} · Single + Scramble</div>
    <div class="sc-team">${esc(teamName(t,i))}</div>
    <div class="sc-status">
      <span class="lbl">Team score</span>
      <span class="val">${r.thru>0 ? fmtRel(r.toPar) + ' · ' + r.strokes + ' strokes · thru ' + r.thru + (r.done?' (final)':'') : 'NOT STARTED'}</span>
    </div>
    <div class="fmt-note">Two boxes per hole: the <b>single's</b> own gross score, and the <b>scramble</b> score the other two make together (both tee off, play the best ball in, one score). They add up against double par — ${totalTeamPar()} for the round.</div>
  </div>`;

  if (duplicateSingles(t)){
    html += `<div class="banner warn">Heads up — the same player is the single for more than one stretch. Each player normally takes one 6-hole stretch.</div>`;
  }

  for (let s=0; s<NUM_SEGS; s++) html += renderSegment(i, t, s);

  html += `<div class="nine-hd">Gross as the single (6 holes each)</div><div class="ptot">`;
  for (let pi=0; pi<TEAM_SIZE; pi++){
    const pt = playerTotal(t, pi);
    html += `<div class="pc">
      <div class="n">${esc(shortName(t,pi))}</div>
      <div class="v">${pt.n ? pt.strokes : '—'}</div>
      <div class="s">${pt.n ? pt.n + ' hole' + (pt.n===1?'':'s') : 'no scores'}</div>
    </div>`;
  }
  html += `</div>`;

  const st = scrambleTotal(t);
  html += `<div class="nine-hd">Scramble side</div>
    <div class="card"><div class="seg-sub" style="border-top:none">
      <span>${st.n}/${NUM_HOLES} holes posted</span>
      <span>${st.n ? `<b>${st.strokes}</b> vs par ${st.parSum} · ${fmtRel(st.toPar)}` : '—'}</span>
    </div></div>`;

  html += `<div style="margin-top:16px"><button class="btn" onclick="closeScore()">Done — back to teams</button></div>`;
  return html;
}

function renderSegment(teamIdx, t, s){
  const from = s*SEG_LEN + 1, to = (s+1)*SEG_LEN;
  const sIdx = t.singles['s'+s];
  const picked = (sIdx===0||sIdx===1||sIdx===2);
  const sr = segResult(t, s);

  let opts = `<option value="">— choose the single —</option>`;
  for (let pi=0; pi<TEAM_SIZE; pi++){
    opts += `<option value="${pi}" ${sIdx===pi?'selected':''}>${esc(playerName(t,pi))}</option>`;
  }
  const partners = [0,1,2].filter(pi=>pi!==sIdx).map(pi=>esc(playerName(t,pi)));

  let html = `<div class="seg">
    <div class="seg-hd">
      <span class="st">Holes ${from}–${to}</span>
      <span class="ss">${sr.n ? fmtRel(sr.toPar) + ' · ' + sr.strokes : ''}</span>
    </div>
    <div class="seg-pick">
      <label>Single for holes ${from}–${to}</label>
      <select onchange="setSingle(${teamIdx},${s},this.value)">${opts}</select>
      <div class="seg-bb">${picked
        ? `Scramble: <b>${partners[0]}</b> &amp; <b>${partners[1]}</b>`
        : `Pick the single to unlock scoring for these six holes. The other two automatically become the scramble pair.`}</div>
    </div>
    <div class="seg-holes">`;

  segHoles(s).forEach(h=>{ html += holeHtml(teamIdx, t, h, picked, sIdx); });

  html += `<div class="seg-sub">
      <span>Holes ${from}–${to} · ${sr.n}/${SEG_LEN} complete</span>
      <span>${sr.n ? `<b>${sr.strokes}</b> vs par ${sr.parSum} · ${fmtRel(sr.toPar)}` : '—'}</span>
    </div>`;
  html += `</div></div>`;
  return html;
}

function holeHtml(teamIdx, t, h, picked, sIdx){
  const hr = holeResult(t, h);
  let tot = `<div class="hc-tot blank">—</div>`;
  if (hr.complete){
    let rc = relClass(hr.rel);
    if (hr.rel <= -2) rc = 'eagle';
    tot = `<div class="hc-tot">${hr.total}<span class="rel ${rc}">${fmtRel(hr.rel)}</span></div>`;
  } else if (hr.any){
    tot = `<div class="hc-tot blank">needs ${hr.single===null?'single':'scramble'}</div>`;
  }

  const singleVal = picked ? t.scores['h'+h+'p'+sIdx] : '';
  const scrVal = t.scores['h'+h+'sc'];

  return `<div class="hcard ${picked?'':'locked'}">
    <div class="hc-hd">
      <div class="hc-num">${h+1}<span class="hc-name">${esc(HOLE_NAMES[h])}</span></div>
      <div class="hc-par">par ${state.par[h]} · team ${teamPar(h)} · hcp ${HOLE_HCP[h]}</div>
      ${tot}
    </div>
    <div class="hc-players">
      <div class="pcell single">
        <div class="pl">${picked?esc(shortName(t,sIdx)):'Single'} <span class="tagS">S</span></div>
        <input class="hinp" id="in_${teamIdx}_${h}_s" type="number" inputmode="numeric" min="1" max="15"
          value="${singleVal!==undefined&&singleVal!==null?singleVal:''}" oninput="setSingleScore(${teamIdx},${h},this.value)">
      </div>
      <div class="pcell scr">
        <div class="pl">Scramble <span class="tagC">2</span></div>
        <input class="hinp" id="in_${teamIdx}_${h}_c" type="number" inputmode="numeric" min="1" max="15"
          value="${scrVal!==undefined&&scrVal!==null?scrVal:''}" oninput="setScrambleScore(${teamIdx},${h},this.value)">
      </div>
    </div>
  </div>`;
}

function renderBoard(){
  const rk = ranked();
  const leader = rk[0];
  let html = '';
  if (leader && leader.r.thru>0){
    let gap = '';
    if (rk.length>1 && rk[1].r.thru>0){
      const d = rk[1].r.toPar - leader.r.toPar;
      gap = d===0 ? 'All square' : ('Leading by ' + d);
    }
    html += `
    <div class="total-card">
      <div class="tc-cap">Leader</div>
      <div class="tc-name">${esc(teamName(leader.team, leader.idx))}</div>
      <div class="tc-pts">${fmtRel(leader.r.toPar)} <span style="font-size:14px;font-weight:600;color:#8fb3a0">thru ${leader.r.thru}</span></div>
      ${gap?`<div class="tc-gap">${esc(gap)}</div>`:''}
    </div>`;
  }
  html += `<div class="card">
    <div class="card-hd"><span class="t">Leaderboard</span><span class="r">${NUM_TEAMS} teams · par ${totalTeamPar()}</span></div>
    <table class="lb-tbl">`;
  rk.forEach((row,pos)=>{
    const r = row.r, t = row.team;
    const rankLbl = r.thru>0 ? (pos+1) : '—';
    const scoreHtml = r.thru>0
      ? `<span class="pill ${r.done?relClass(r.toPar):'live'}">${fmtRel(r.toPar)}</span><div class="tr-thru">${r.strokes}</div>`
      : `<span class="pill pend">—</span>`;
    const roster = rosterLine(t);
    html += `<tr>
      <td class="lb-rank">${rankLbl}</td>
      <td><div class="lb-team">${esc(teamName(t,row.idx))}</div>${roster?`<div class="lb-sub">${esc(roster)}</div>`:''}</td>
      <td class="lb-thru">${r.thru>0 ? 'thru '+r.thru : ''}</td>
      <td class="lb-score">${scoreHtml}</td>
    </tr>`;
  });
  html += `</table></div>`;
  return html;
}

function renderSkins(){
  const rows = skinsRows();
  const played = rows.filter(r=>r.best!==null).length;
  const won = rows.filter(r=>r.skin).length;
  const tied = played - won;

  let html = `<div class="banner"><b>Skins:</b> the low team score on a hole wins that hole's skin. If two or more teams tie for low, the hole is carried as a push and nobody takes it.</div>`;

  html += `<div class="sk-tally">`;
  state.teams.forEach((t,i)=>{
    const n = skinsWonBy(rows, i);
    html += `<div class="c">
      <div class="n">${esc(teamName(t,i))}</div>
      <div class="v">${n}</div>
      <div class="s">skin${n===1?'':'s'}</div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="card">
    <div class="card-hd"><span class="t">Skins by hole</span><span class="r">${won} won · ${tied} tied · ${NUM_HOLES-played} to play</span></div>
    <table class="sk-tbl">
      <tr><th>Hole</th><th style="text-align:center">Low</th><th>Team</th><th style="text-align:center">Skin</th></tr>`;

  rows.forEach(r=>{
    const par = teamPar(r.h);
    let low, team, skin;
    if (r.best===null){
      low  = `<td class="sk-low none">—</td>`;
      team = `<td class="sk-team none">Not played</td>`;
      skin = `<td class="sk-skin"></td>`;
    } else {
      const rel = r.best - par;
      low  = `<td class="sk-low">${r.best}<span class="r">${fmtRel(rel)}</span></td>`;
      team = `<td class="sk-team">${r.winners.map(i=>esc(teamName(state.teams[i],i))).join('<br>')}</td>`;
      skin = r.skin
        ? `<td class="sk-skin"><span class="sk-yes">&#10003;</span></td>`
        : `<td class="sk-skin"><span class="sk-tie">TIED</span></td>`;
    }
    html += `<tr class="${r.skin?'won':''}">
      <td class="sk-h">${r.h+1}<span class="p">par ${state.par[r.h]}</span></td>
      ${low}${team}${skin}
    </tr>`;
  });

  html += `</table></div>`;
  return html;
}

function renderAdmin(){
  if (!adminOk){
    return `<div class="alogin">
      <div style="font-weight:700;font-size:15px">Committee access</div>
      <input id="pwd" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')tryPwd()">
      <button class="btn" onclick="tryPwd()" style="width:100%">Unlock</button>
    </div>`;
  }
  let html = `<div class="atabs">
    <button class="atab ${adminTab==='teams'?'on':''}" onclick="setAtab('teams')">Teams</button>
    <button class="atab ${adminTab==='bulk'?'on':''}" onclick="setAtab('bulk')">Bulk roster</button>
    <button class="atab ${adminTab==='course'?'on':''}" onclick="setAtab('course')">Course / Par</button>
    <button class="atab ${adminTab==='event'?'on':''}" onclick="setAtab('event')">Event</button>
    <button class="atab ${adminTab==='reset'?'on':''}" onclick="setAtab('reset')">Reset</button>
  </div>`;

  if (adminTab==='teams'){
    html += `<div class="sess-meta">Three players per team. Leave the team name blank to use last names (e.g. "Smith / Jones / Brown"). Edits save instantly for everyone.</div>`;
    state.teams.forEach((t,i)=>{
      const named = PKEYS.some(k=>String(t[k]||'').trim()) || String(t.name||'').trim();
      html += `<div class="team-card">
        <div class="tc-hd">Team ${i+1}</div>
        <div class="tc-derived ${named?'':'empty'}">${esc(named ? teamName(t,i) : 'Team ' + (i+1) + ' — add players')}</div>
        <input value="${esc(t.name)}" onchange="setTeamField(${i},'name',this.value)" placeholder="Team name (optional)">
        <input value="${esc(t.p1)}" onchange="setTeamField(${i},'p1',this.value)" placeholder="Player 1">
        <input value="${esc(t.p2)}" onchange="setTeamField(${i},'p2',this.value)" placeholder="Player 2">
        <input value="${esc(t.p3)}" onchange="setTeamField(${i},'p3',this.value)" placeholder="Player 3">
      </div>`;
    });
  }

  if (adminTab==='bulk'){
    html += `<div class="sess-meta">One team per line, players separated by commas. Up to ${NUM_TEAMS} lines. An optional team name goes first with a colon:<br>
      <code>Smith, Jones, Brown</code><br><code>The Ringers: Smith, Jones, Brown</code></div>`;
    html += `<textarea class="bulk" id="bulkbox" placeholder="Smith, Jones, Brown\nDoe, Rivera, Chen"></textarea>`;
    html += `<div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button class="btn" onclick="applyBulk()">Apply roster</button>
      <button class="btn ghost sm" onclick="fillBulk()">Load current</button>
      <span style="font-size:12px;color:var(--green);font-weight:600">${esc(bulkMsg)}</span>
    </div>`;
  }

  if (adminTab==='course'){
    const outSum = state.par.slice(0,9).reduce((a,b)=>a+(parseInt(b)||0),0);
    const inSum  = state.par.slice(9,18).reduce((a,b)=>a+(parseInt(b)||0),0);
    html += `<div class="sess-meta">${esc(COURSE_NAME)} — par per hole. Team par is double this on every hole, since each team posts two scores.</div>`;
    html += `<div class="nine-hd">Front 9 (out: ${outSum})</div><div class="par-grid">`;
    for (let h=0; h<9; h++){
      html += `<div class="par-cell"><div class="l">${h+1} · ${esc(HOLE_NAMES[h])}</div><input type="number" min="3" max="6" value="${state.par[h]}" onchange="setPar(${h},this.value)"></div>`;
    }
    html += `</div><div class="nine-hd">Back 9 (in: ${inSum})</div><div class="par-grid">`;
    for (let h=9; h<18; h++){
      html += `<div class="par-cell"><div class="l">${h+1} · ${esc(HOLE_NAMES[h])}</div><input type="number" min="3" max="6" value="${state.par[h]}" onchange="setPar(${h},this.value)"></div>`;
    }
    html += `</div>`;
    html += `<div class="par-totals">Course par: ${outSum+inSum} &nbsp;·&nbsp; Team par (doubled): <b>${(outSum+inSum)*2}</b></div>`;
  }

  if (adminTab==='event'){
    html += `<div class="sess-meta">Shown in the header on everyone's phone.</div>`;
    html += `<div class="team-card">
      <div class="tc-hd">Event name</div>
      <input value="${esc(state.eventName)}" onchange="setEventName(this.value)" placeholder="${EVENT_DEFAULT}">
    </div>`;
  }

  if (adminTab==='reset'){
    html += `<div class="sess-meta">Rosters are kept unless you clear them explicitly.</div>`;
    html += `<div class="reset-row"><span>All hole scores (${NUM_TEAMS} teams)</span><button class="btn danger sm" onclick="clearScores()">Clear scores</button></div>`;
    html += `<div class="reset-row"><span>Single selections (holes 1 / 7 / 13)</span><button class="btn danger sm" onclick="clearSingles()">Clear singles</button></div>`;
    html += `<div class="reset-row"><span>Everything — rosters, singles, scores</span><button class="btn danger sm" onclick="clearAll()">Full reset</button></div>`;
  }
  return html;
}

/* ---------- Actions ---------- */
function go(v){ view=v; scoringIdx=null; bulkMsg=''; render(); window.scrollTo(0,0); }
function setAtab(t){ adminTab=t; bulkMsg=''; render(); }
function openScore(idx){ scoringIdx=idx; render(); window.scrollTo(0,0); }
function closeScore(){ scoringIdx=null; render(); window.scrollTo(0,0); }
function tryPwd(){
  const el = document.getElementById('pwd');
  if (el.value === ADMIN_PASSWORD){ adminOk=true; render(); }
  else { el.value=''; el.placeholder='Wrong password'; }
}

function clampScore(val){
  const n = parseInt(val);
  return (val === '' || isNaN(n)) ? null : Math.max(1, Math.min(15, n));
}
function writeScore(idx, key, v){
  if (v === null) delete state.teams[idx].scores[key];
  else state.teams[idx].scores[key] = v;
  persist(`teams/${idx}/scores/${key}`, v);
  renderPreservingFocus();
}
function setSingleScore(idx, hole, val){
  const sIdx = state.teams[idx].singles['s'+segOf(hole)];
  if (sIdx===null || sIdx===undefined) return;
  writeScore(idx, 'h'+hole+'p'+sIdx, clampScore(val));
}
function setScrambleScore(idx, hole, val){
  writeScore(idx, 'h'+hole+'sc', clampScore(val));
}

function setSingle(idx, seg, val){
  const v = (val === '') ? null : parseInt(val);
  state.teams[idx].singles['s'+seg] = v;
  persist(`teams/${idx}/singles/s${seg}`, v);
  render();
}

function setTeamField(idx, field, val){
  state.teams[idx][field] = val;
  persist(`teams/${idx}/${field}`, val);
  render();
}

function setEventName(val){
  state.eventName = String(val||'').trim() || EVENT_DEFAULT;
  persist('eventName', state.eventName);
  render();
}

function setPar(hole, val){
  const v = Math.max(3, Math.min(6, parseInt(val)||4));
  state.par[hole] = v;
  persist(`par/${hole}`, v);
  render();
}

function fillBulk(){
  const lines = state.teams.map(t=>{
    const ns = PKEYS.map(k=>String(t[k]||'').trim()).filter(Boolean).join(', ');
    const nm = String(t.name||'').trim();
    return nm ? (nm + ': ' + ns) : ns;
  });
  document.getElementById('bulkbox').value = lines.join('\n');
}

function applyBulk(){
  const raw = document.getElementById('bulkbox').value;
  const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  if (!lines.length){ bulkMsg = 'Nothing to apply.'; render(); return; }
  if (lines.length > NUM_TEAMS){ bulkMsg = `Too many lines (${lines.length}) — max ${NUM_TEAMS}.`; render(); return; }
  if (!confirm(`Replace the roster for the first ${lines.length} team(s)?`)) return;
  lines.forEach((line, i)=>{
    let name = '', rest = line;
    const c = line.indexOf(':');
    if (c > -1){ name = line.slice(0,c).trim(); rest = line.slice(c+1); }
    const ps = rest.split(',').map(s=>s.trim()).filter(Boolean).slice(0, TEAM_SIZE);
    const t = state.teams[i];
    t.name = name;
    PKEYS.forEach((k, pi)=>{ t[k] = ps[pi] || ''; });
    persist(`teams/${i}/name`, t.name);
    PKEYS.forEach(k=> persist(`teams/${i}/${k}`, t[k]));
  });
  bulkMsg = `Applied ${lines.length} team(s).`;
  render();
}

function clearScores(){
  if (!confirm('Clear every hole score for all ' + NUM_TEAMS + ' teams?')) return;
  state.teams.forEach((t,i)=>{ t.scores = {}; persist(`teams/${i}/scores`, null); });
  render();
}
function clearSingles(){
  if (!confirm('Clear the single selection for every team?')) return;
  state.teams.forEach((t,i)=>{
    for (let s=0;s<NUM_SEGS;s++) t.singles['s'+s] = null;
    persist(`teams/${i}/singles`, null);
  });
  render();
}
function clearAll(){
  if (!confirm('Full reset — wipe rosters, singles and scores?')) return;
  state = defaultState();
  if (!localMode && ref) ref.set(state); else persist('', null);
  render();
}

function renderPreservingFocus(){
  const a = document.activeElement;
  const id = a && a.id ? a.id : null;
  const val = id ? a.value : null;
  const selStart = (id && a.selectionStart!==undefined) ? a.selectionStart : null;
  render();
  if (id){
    const el = document.getElementById(id);
    if (el){
      el.focus();
      if (el.tagName==='INPUT' && val!==null && el.value!==val) el.value = val;
      try{ if (selStart!==null) el.setSelectionRange(selStart, selStart); }catch(e){}
    }
  }
}

render();
</script>
</body>
</html>
